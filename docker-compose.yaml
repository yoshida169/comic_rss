services:
  postgres:
    image: postgres:17
    container_name: db-for-go
    environment:
      POSTGRES_DB: ${DATABASE}
      POSTGRES_USER: ${USERNAME}
      POSTGRES_PASSWORD: ${USERPASS}
      TZ: 'Asia/Tokyo'
    ports:
      - "5432:5432"
    volumes:
      - db-volume:/var/lib/postgresql/data

volumes:
  db-volume:
